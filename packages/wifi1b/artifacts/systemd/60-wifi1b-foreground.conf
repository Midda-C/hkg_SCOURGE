# TARGET: Gen5W_L EU 260128
# SCOURGE_WIFI1B_MDNS_FOREGROUND=1
# Stock mdnsd daemonizes unless -debug is passed. Supervise the real process,
# not its successfully exiting parent; retain the stock uid drop.
[Service]
Type=simple
ExecStart=
ExecStart=/app/bin/mdnsd -debug
RemainAfterExit=no
Restart=on-failure
RestartSec=2
