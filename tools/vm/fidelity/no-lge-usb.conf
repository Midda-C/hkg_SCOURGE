# TARGET: Ioniq 5 Gen5W_L, firmware NE_E.EUR.S5W_L.001.001.260128 (EU).
#
# Projection-only neutralisation of the vendor USB adapter. On non-vendor
# QEMU hardware its probe can hold the platform device lock and deadlock
# esinit before the fan path. This is a documented lab fix, not stock boot.
install lge_usb_adapter /bin/true
